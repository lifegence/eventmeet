[project]
name = "eventmeet"
authors = [
    { name = "Lifegence", email = "info@lifegence.com"}
]
description = "EventMeet: seminar & internal meeting management for Frappe (v15/v16) with Stripe, Zoom and Google Meet"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = [
    # "frappe>=15.0.0,<17.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "W191", "E101"]

[tool.ruff.format]
indent-style = "tab"
