[project]
name = "eventmeet"
authors = [
    { name = "Lifegence Corporation", email = "contact@lifegence.com" }
]
description = "EventMeet: seminar & internal meeting management for Frappe (v15/v16) with Stripe, Zoom and Google Meet"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
keywords = ["frappe", "seminar", "event", "meeting", "zoom", "google-meet", "stripe"]
classifiers = [
    "Framework :: Frappe",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    # "frappe>=15.0.0,<17.0.0" # Installed and managed by bench.
    # Check-in QR codes in confirmation emails (pyqrcode writes PNGs through pypng).
    "pyqrcode>=1.2.1,<2",
    "pypng>=0.20220715.0",
]

[project.urls]
Homepage = "https://github.com/lifegence/eventmeet"
Documentation = "https://github.com/lifegence/eventmeet/tree/main/docs"
Issues = "https://github.com/lifegence/eventmeet/issues"
Changelog = "https://github.com/lifegence/eventmeet/blob/main/CHANGELOG.md"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "W191", "E101"]

[tool.ruff.format]
indent-style = "tab"
