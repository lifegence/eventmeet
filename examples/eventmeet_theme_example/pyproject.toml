[project]
name = "eventmeet_theme_example"
authors = [{ name = "Lifegence Corporation", email = "contact@lifegence.com" }]
description = "Example theme app for EventMeet: replaces the seminar list and seminar page templates"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
