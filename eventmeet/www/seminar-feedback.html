{% extends "templates/web.html" %}

{% block page_content %}
{% include em.template %}
{% endblock %}

{% block script %}
{{ super() }}
<script>
	(function () {
		const form = document.getElementById("ls-feedback-form");
		if (!form) return;
		form.addEventListener("submit", function (event) {
			event.preventDefault();
			const data = Object.fromEntries(new FormData(form).entries());
			data.token = {{ (token) | tojson }};
			form.querySelector("button[type=submit]").disabled = true;
			frappe.call({
				method: "eventmeet.api.public.submit_feedback",
				type: "POST",
				args: data,
				callback: function () {
					form.style.display = "none";
					document.getElementById("ls-feedback-done").style.display = "block";
				},
				error: function () { form.querySelector("button[type=submit]").disabled = false; },
			});
		});
	})();
</script>
{% endblock %}
