{% extends "templates/web.html" %}

{% block page_content %}
{% include em.template %}
{% endblock %}

{% block script %}
{{ super() }}
{% include "eventmeet/templates/includes/source_tracking.html" %}
<script>
	(function () {
		const form = document.getElementById("ls-register-form");
		if (!form) return;
		form.addEventListener("submit", function (event) {
			event.preventDefault();
			const button = form.querySelector("button[type=submit]");
			const message = document.getElementById("ls-register-message");
			const source = window.eventmeetSource ? window.eventmeetSource() : {};
			const formData = new FormData(form);
			const data = Object.assign({}, source, Object.fromEntries(formData.entries()));
			// Several checkboxes share the name "interests": send all the chosen topics.
			data.interests = formData.getAll("interests").join("\n");
			data.seminar = {{ (doc.name) | tojson }};
			button.disabled = true;
			message.textContent = {{ (_("Processing...")) | tojson }};
			frappe.call({
				method: "eventmeet.api.public.register",
				type: "POST",
				args: data,
				callback: function (r) {
					if (r.message && r.message.redirect_url) {
						window.location.href = r.message.redirect_url;
					}
				},
				error: function () {
					button.disabled = false;
					message.textContent = "";
				},
			});
		});
	})();
</script>
{% endblock %}
