{% extends "templates/web.html" %}

{% block page_content %}
{% include em.template %}
{% endblock %}

{% block script %}
{{ super() }}
<script>
	(function () {
		const form = document.getElementById("ls-register-form");
		if (!form) return;
		form.addEventListener("submit", function (event) {
			event.preventDefault();
			const button = form.querySelector("button[type=submit]");
			const message = document.getElementById("ls-register-message");
			const data = Object.fromEntries(new FormData(form).entries());
			data.seminar = {{ (doc.name) | tojson }};
			button.disabled = true;
			message.textContent = {{ (_("Processing...")) | tojson }};
			frappe.call({
				method: "eventmeet.api.public.register",
				type: "POST",
				args: data,
				callback: function (r) {
					if (r.message && r.message.redirect_url) {
						window.location.href = r.message.redirect_url;
					}
				},
				error: function () {
					button.disabled = false;
					message.textContent = "";
				},
			});
		});
	})();
</script>
{% endblock %}
