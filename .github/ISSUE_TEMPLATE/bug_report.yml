name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Frappe version and EventMeet version or commit
      placeholder: Frappe 16.33.1, EventMeet 0.1.0
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration involved
      multiple: true
      options: [None, Zoom, Google Meet, Stripe]
  - type: textarea
    id: logs
    attributes:
      label: Error Log entries
      description: Remove secrets, tokens and personal data before pasting.
      render: text
