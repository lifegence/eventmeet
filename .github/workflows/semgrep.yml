name: semgrep

on:
  push:
    paths: ["**/*.py"]
  pull_request:
    paths: ["**/*.py"]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: semgrep (gate on ERROR severity)
        run: |
          semgrep --config .semgrep/lifegence.yml --severity ERROR --error \
            --exclude '*/node_modules/*' --exclude '*/e2e/*' --exclude '*test*' .
