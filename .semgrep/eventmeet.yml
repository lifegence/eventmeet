# EventMeet security / quality rules (CI gates on ERROR severity)
# Run: semgrep --config .semgrep/eventmeet.yml eventmeet
rules:
  - id: eventmeet-fstring-sql
    message: >
      frappe.db.sql receives an f-string or formatted string. Pass values as
      parameters (%s / %(name)s). If only constants are interpolated, add
      "# nosemgrep: eventmeet-fstring-sql" with a comment explaining why.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: frappe.db.sql(f"...", ...)
          - pattern: frappe.db.sql(f"..." % ..., ...)
          - pattern: frappe.db.sql("..." + $X, ...)
          - pattern: frappe.db.sql("...".format(...), ...)

  - id: eventmeet-silent-except-pass
    message: >
      'except Exception: pass' hides failures. Log them at least
      (frappe.logger().warning / frappe.log_error), or catch a narrower
      exception type and comment on the intent.
    severity: WARNING
    languages: [python]
    pattern: |
      try:
          ...
      except Exception:
          pass

  - id: eventmeet-bare-except
    message: "A bare except: also catches SystemExit and KeyboardInterrupt. Catch Exception (or narrower) instead."
    severity: ERROR
    languages: [python]
    pattern: |
      try:
          ...
      except:
          ...

  - id: eventmeet-new-guest-endpoint
    message: >
      New allow_guest=True endpoint. Add it to the table in
      docs/security/guest-endpoint-audit.md with its authorization, input
      validation and rate limit (frappe.rate_limiter). Audited endpoints may
      use nosemgrep.
    severity: WARNING
    languages: [python]
    pattern: frappe.whitelist(allow_guest=True, ...)

  - id: eventmeet-guest-ignore-permissions-insert
    message: >
      Write with ignore_permissions=True. If a guest can reach this path, it
      must be guarded by a token, a signature or a rate limit.
    severity: INFO
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $DOC.insert(ignore_permissions=True)
          - pattern: $DOC.save(ignore_permissions=True)
