# 正本: company-os/.semgrep/lifegence.yml — 変更は company-os 側に反映すること
# Lifegence セキュリティ/品質ルール (R4)
# 実行: semgrep --config .semgrep/lifegence.yml <path>
# アプリ横断実行: scripts/run-semgrep.sh (frappe-bench/apps の lifegence_* を一括)
rules:
  - id: lifegence-fstring-sql
    message: >
      frappe.db.sql に f-string を渡しています。値はプレースホルダ (%s /
      %(name)s) でパラメータ化してください。定数のみの補間で安全な場合は
      行末に「# nosemgrep: lifegence-fstring-sql」と根拠コメントを付与。
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: frappe.db.sql(f"...", ...)
          - pattern: frappe.db.sql(f"..." % ..., ...)
          - pattern: frappe.db.sql("..." + $X, ...)
          - pattern: frappe.db.sql("...".format(...), ...)

  - id: lifegence-silent-except-pass
    message: >
      'except Exception: pass' は障害を握りつぶします。最低限
      frappe.logger().warning / frappe.log_error を入れるか、捕捉する
      例外型を限定して意図をコメントしてください。
    severity: WARNING
    languages: [python]
    pattern: |
      try:
          ...
      except Exception:
          pass

  - id: lifegence-bare-except
    message: "裸の except: は SystemExit/KeyboardInterrupt まで捕捉します。except Exception: 以上に限定してください。"
    severity: ERROR
    languages: [python]
    pattern: |
      try:
          ...
      except:
          ...

  - id: lifegence-new-guest-endpoint
    message: >
      新規の allow_guest=True エンドポイントです。docs/security/
      guest-endpoint-audit の表に追記し、認可方式・入力検証・レート制限
      (frappe.rate_limiter) を設計してください。既存監査済みは nosemgrep 可。
    severity: WARNING
    languages: [python]
    pattern: frappe.whitelist(allow_guest=True, ...)

  - id: lifegence-guest-ignore-permissions-insert
    message: >
      ignore_permissions=True の書込です。ゲスト到達パスから呼ばれる場合は
      認可設計（トークン/署名/レート制限）を必ず添えてください。
    severity: INFO
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $DOC.insert(ignore_permissions=True)
          - pattern: $DOC.save(ignore_permissions=True)
